<!DOCTYPE html>
<html>
    <head>
        <title>course table</title>

    </head>
    <body>    
        <h1>Courses</h1>
       <table>
        <tr>
            <th>ID</th>
            <th> Course Name</th>
            <th>Department</th>
            
        </tr>
      {% for course in courses %}
        <tr>
            <td>{{ course[0] }}</td>
            <td>{{ course[1] }}</td>
            <td>{{ course[2] }}</td>
        </tr>
        {% endfor %}
    </table>

    <br>

    <a href="/courses/add">Add Course</a>
    <br><br>

    <a href="/dashboard">Back to Dashboard</a>

</body>
</html>
