<!DOCTYPE html>
<html>
    <head>
        <title>students page</title>

    </head>
    <body>
        <h1>Student's record</h1>
       <table>
        <tr>
            <th>ID</th>
            <th>Name</th>
            <th>Email</th>
            <th>Course</th>
            <th>Actions</th>
        </tr>
        {% for student in students %}
        <tr>
    <td>{{ student[0] }}</td>
<td>{{ student[1] }}</td>
<td>{{ student[2] }}</td>
<td>{{ student[3] }}</td>
    <td>
        
        <a href="/students/delete/{{ student[0] }}">Delete</a>
    </td>
</tr>
{% endfor %}
       </table>
      <a href="/students/add">Add Student</a> 
    </body>
    
</html>
