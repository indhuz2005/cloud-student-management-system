<!DOCTYPE html>
<html>
    <head>
        <title>academics html</title>

    </head>
    <body>  
        <h1>Academic entry</h1>
      <form action="/academics/add" method="post">
        <label>Student's name:</label>
        <input type="text" name="name"><br><br>
         <label>Course:</label>
        <input type="text" name="course"><br><br>
         <label>Marks:</label>
        <input type="number" name="marks"><br><br>
        <label>Grade:</label>
        <input type="text" name="grade"><br><br>
        <button type="submit">Add Record</button>
      </form>

    <br>

    <a href="/academics">Back to Academic Records</a>

</body>
</html>
